<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOUND CHECK. 左右声道测试</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<meta name="theme-color" content="#F5F5F7">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;background:#F5F5F7;color:#1C1C1E;letter-spacing:-.01em;min-height:100vh;padding:0 20px calc(40px + env(safe-area-inset-bottom));overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto}
header{padding:54px 6px 6px}
h1{font-size:44px;font-weight:700;letter-spacing:-.03em}
h1 .dot{color:#007AFF}
.sub{font-size:15px;color:#86868B;margin-top:4px}
/* 两张大卡 */
.sides{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}
.side{background:#FFFFFF;border-radius:26px;padding:26px 16px 22px;text-align:center;position:relative;overflow:hidden;border:1.5px solid rgba(0,0,0,.04);box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;transition:all .35s;font-family:inherit}
.side.on{border-color:#007AFF;box-shadow:0 6px 26px rgba(0,122,255,.3);transform:translateY(-2px)}
.big{font-size:56px;font-weight:800;letter-spacing:-.04em;color:#D1D1D6;line-height:1;transition:color .3s}
.side.on .big{color:#007AFF}
.song{font-size:14.5px;font-weight:600;color:#3A3A3C;margin-top:10px}
.mode{font-size:11px;color:#86868B;letter-spacing:.14em;margin-top:2px;text-transform:uppercase}
.side.on .mode{color:#007AFF}
/* 波纹 */
.rings{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
.side.on .rings{opacity:1}
.rings i{position:absolute;left:50%;top:52px;width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,122,255,.45);transform:translate(-50%,-50%)}
.rings i:nth-child(1){animation:ring 2.2s ease-out infinite}
.rings i:nth-child(2){animation:ring 2.2s ease-out .73s infinite}
.rings i:nth-child(3){animation:ring 2.2s ease-out 1.46s infinite}
@keyframes ring{0%{width:18px;height:18px;opacity:.85}100%{width:170px;height:170px;opacity:0}}
/* 音符雨 */
.notes{height:30px;margin-top:14px;position:relative;overflow:hidden}
.notes span{position:absolute;left:0;right:0;top:0;font-size:12px;color:#007AFF;font-weight:600;letter-spacing:.06em;animation:floatup 3.2s ease-out forwards;font-variant-numeric:tabular-nums}
@keyframes floatup{0%{opacity:0;transform:translateY(14px)}12%{opacity:.95}80%{opacity:.5}100%{opacity:0;transform:translateY(-14px)}}
.tip{font-size:13.5px;color:#86868B;margin-top:22px;padding:0 6px;line-height:1.7;text-align:center}
.tip b{color:#3A3A3C;font-weight:600}
/* 关闭/继续按钮 */
.stopbtn{margin-top:20px;width:100%;padding:16px 18px;border:0;border-radius:16px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1.5px solid rgba(0,0,0,.04);font-family:inherit;font-size:17px;color:#1C1C1E;display:none;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.eq{display:flex;width:14px;height:14px;align-items:flex-end;gap:2px}
.stopbtn.off .eq{display:none}
.eq i{width:3px;background:#007AFF;border-radius:1px;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.22s}.eq i:nth-child(3){animation-delay:.44s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.stopbtn.go{color:#007AFF;font-weight:600}
footer{margin-top:30px;text-align:center;font-size:11.5px;color:#AEAEB2;line-height:1.8}
/* 启动遮罩（仅当浏览器拦截自动播放时出现） */
.gate{position:fixed;inset:0;background:rgba(245,245,247,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;transition:opacity .5s}
.gate.off{opacity:0;pointer-events:none}
.playbtn{width:104px;height:104px;border-radius:50%;background:#007AFF;border:0;box-shadow:0 10px 34px rgba(0,122,255,.42);cursor:pointer;position:relative;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
.playbtn:after{content:"";position:absolute;left:39px;top:32px;border-style:solid;border-width:20px 0 20px 32px;border-color:transparent transparent transparent #fff}
.gate p{margin-top:26px;font-size:15px;color:#3A3A3C;font-weight:600}
.gate small{margin-top:6px;font-size:12.5px;color:#86868B}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>SOUND CHECK<span class="dot">.</span></h1>
  <div class="sub">一副耳机 · 两首歌 · 左右声道测试</div>
</header>

<div class="sides">
  <button class="side" id="sideL" ontouchstart="">
    <div class="rings"><i></i><i></i><i></i></div>
    <div class="big">L</div>
    <div class="song">月色 · A 小调</div>
    <div class="mode" id="modeL">左声道 · 静候</div>
    <div class="notes" id="notesL"></div>
  </button>
  <button class="side" id="sideR" ontouchstart="">
    <div class="rings"><i></i><i></i><i></i></div>
    <div class="big">R</div>
    <div class="song">日光 · C 大调</div>
    <div class="mode" id="modeR">右声道 · 点击播放</div>
    <div class="notes" id="notesR"></div>
  </button>
</div>

<button class="stopbtn" id="btnStop" ontouchstart="">
  <span class="eq"><i></i><i></i><i></i></span>
  <span id="stopTxt">关闭声音</span>
</button>

<div class="tip">戴上耳机，点一下 <b>播放</b>——左耳会先响起一首 <b>月色</b>；再点右侧卡片，<b>日光</b> 换到右耳。声音只该出现在正在播放的那一侧耳朵。</div>

<footer>🎧 请佩戴耳机 · 音量适中</footer>
</div>

<div class="gate" id="gate">
  <button class="playbtn" id="gateBtn" ontouchstart="" aria-label="开始播放"></button>
  <p>点一下，开始播放</p>
  <small>左声道 · 月色 · A 小调</small>
</div>

<script>
/* ============ 生成式双声道音乐引擎 ============ */
var AC=null,merger,master,masterL,masterR;
var anaL=null,anaR=null; /* 仅用于自检 */
var buses={};            /* 每侧总线 {bus,lp,delay,fb,wet} */
var sched={};            /* 每侧调度游标 */
var curSide=null,schedTimer=null;
var NOTE=["C","C♯","D","E♭","E","F","F♯","G","A♭","A","B♭","B"];

/* 两首曲子：和弦池（散步用音集）+ 速度 + 音色性格 */
var SONGS={
  L:{name:"月色",key:"A 小调",step:0.42,lp:1600,dT:0.46,fb:0.36,base:57,
     chords:[[57,60,64,67,71,72,76],[53,57,60,64,69,72,76],[48,55,59,60,64,67,72],[43,50,55,59,62,67,71]]},
  R:{name:"日光",key:"C 大调",step:0.36,lp:2400,dT:0.34,fb:0.3,base:60,
     chords:[[60,64,67,71,72,76,79],[57,60,64,67,72,76,79],[53,57,60,64,65,69,72],[55,59,62,64,67,71,74]]}
};

function mtof(m){return 440*Math.pow(2,(m-69)/12)}

function ensureCtx(){
  if(AC)return;
  var C=window.AudioContext||window.webkitAudioContext;
  AC=new C();
  merger=AC.createChannelMerger(2);
  master=AC.createGain();master.gain.value=.62;
  master.connect(AC.destination);
  ["L","R"].forEach(function(s){
    var bus=AC.createGain();
    var lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=SONGS[s].lp;lp.Q.value=.4;
    var mg=AC.createGain();mg.gain.value=(s==="L")?1:0; /* masterL/R */
    var an=AC.createAnalyser();an.fftSize=512;
    bus.connect(lp);lp.connect(mg);mg.connect(an);an.connect(merger,0,s==="L"?0:1);
    var dly=AC.createDelay(2);dly.delayTime.value=SONGS[s].dT;
    var fb=AC.createGain();fb.gain.value=SONGS[s].fb;
    var wet=AC.createGain();wet.gain.value=.3;
    var send=AC.createGain();send.gain.value=.45;
    lp.connect(send);send.connect(dly);dly.connect(fb);fb.connect(dly);dly.connect(wet);wet.connect(mg);
    buses[s]={bus:bus,lp:lp,delay:dly,fb:fb,wet:wet,mg:mg};
    sched[s]={next:0,step:0,ci:0,deg:3};
    if(s==="L")masterL=mg;else masterR=mg;
  });
  merger.connect(master);
}
/* 测试探针（不显示 UI） */
function probe(side){
  if(!buses[side]._an){
    var an=AC.createAnalyser();an.fftSize=512;
    buses[side].mg.connect(an);
    buses[side]._an=an;buses[side]._td=new Uint8Array(512);
  }
  var a=buses[side]._an,td=buses[side]._td;
  a.getByteTimeDomainData(td);
  var sum=0;for(var i=0;i<td.length;i++){var v=(td[i]-128)/128;sum+=v*v}
  return Math.sqrt(sum/td.length);
}

/* 一个音符：主音正弦 + 八度泛音三角 + 柔包络 */
function note(side,midi,t,vel,dur){
  var f=mtof(midi),b=buses[side].bus;
  var o=AC.createOscillator();o.type="sine";o.frequency.value=f;
  var o2=AC.createOscillator();o2.type="triangle";o2.frequency.value=f*2.002;
  var g=AC.createGain();g.gain.value=0;
  var g2=AC.createGain();g2.gain.value=.14;
  o.connect(g);o2.connect(g2);g2.connect(g);
  g.connect(b);
  var a=.018,rel=dur||2.6;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vel,t+a);
  g.gain.exponentialRampToValueAtTime(.0004,t+a+rel);
  o.start(t);o2.start(t);
  o.stop(t+a+rel+.1);o2.stop(t+a+rel+.1);
  o.onended=function(){try{g.disconnect()}catch(e){}};
  showNote(side,midi);
}
/* 低音：根音长音 */
function bass(side,midi,t){
  var f=mtof(midi),b=buses[side].bus;
  var o=AC.createOscillator();o.type="sine";o.frequency.value=f;
  var g=AC.createGain();g.gain.value=0;
  o.connect(g);g.connect(b);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.16,t+.25);
  g.gain.linearRampToValueAtTime(.0,t+7.4);
  o.start(t);o.stop(t+7.6);
  o.onended=function(){try{g.disconnect()}catch(e){}};
}
/* 和弦垫：两个泛音长音 */
function pad(side,notes,t){
  var b=buses[side].bus;
  notes.slice(0,3).forEach(function(m,i){
    var o=AC.createOscillator();o.type="sine";o.frequency.value=mtof(m);
    var g=AC.createGain();g.gain.value=0;
    o.connect(g);g.connect(b);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(.028-i*.006,t+1.6);
    g.gain.setValueAtTime(.028-i*.006,t+5.6);
    g.gain.linearRampToValueAtTime(0,t+7.6);
    o.start(t);o.stop(t+7.7);
    o.onended=function(){try{g.disconnect()}catch(e){}};
  });
}

function scheduleStep(side){
  var S=SONGS[side],sc=sched[side];
  var t=sc.next;
  var chord=S.chords[sc.ci% S.chords.length];
  var stepsPerChord=16;
  if(sc.step%stepsPerChord===0){ /* 新小节：换和声 */
    if(sc.step>0)sc.ci++;chord=S.chords[sc.ci%S.chords.length];
    bass(side,chord[0]-24,t);
    pad(side,chord.slice(0,3),t);
  }
  /* 琶音散步：沿和弦音池缓步 */
  if(Math.random()<.8){
    var pool=chord;
    var jump=Math.round((Math.random()*2-1)*(Math.random()<.22?2:1));
    sc.deg=Math.max(0,Math.min(pool.length-1,sc.deg+jump));
    if(Math.random()<.1)sc.deg=Math.floor(Math.random()*pool.length);
    var midi=pool[sc.deg]+(Math.random()<.15?12:0);
    var vel=(sc.step%8===0)?.16:.09+Math.random()*.05;
    note(side,midi,t+Math.random()*.03,vel);
  }
  sc.step++;sc.next+=S.step;
}
function tick(){
  if(!curSide||!AC||AC.state!=="running")return;
  var S=SONGS[curSide],sc=sched[curSide];
  if(sc.next<AC.currentTime)sc.next=AC.currentTime+.05; /* 后台归来防追帧爆音 */
  while(sc.next<AC.currentTime+.4){scheduleStep(curSide)}
}

/* 关闭声音：总闸优雅淡出 */
var userStopped=false,lastSide="L",susTimer=null;
function stopAudio(){
  if(!AC||!curSide)return;
  var t=AC.currentTime;
  var mg=master.gain;
  mg.cancelScheduledValues(t);mg.setValueAtTime(mg.value,t);
  mg.linearRampToValueAtTime(0,t+.8);
  curSide=null;userStopped=true;ui();
  if(schedTimer){clearInterval(schedTimer);schedTimer=null}
  if(susTimer)clearTimeout(susTimer);
  susTimer=setTimeout(function(){susTimer=null;if(!curSide&&AC)AC.suspend()},1300);
}
function startSched(){
  if(!schedTimer)schedTimer=setInterval(tick,110);
}
function resumeAudio(side){
  ensureCtx();
  if(AC.state==="suspended")AC.resume();
  var t=AC.currentTime;
  var mg=master.gain;
  if(mg.value<0.1){mg.cancelScheduledValues(t);mg.setValueAtTime(mg.value,t);mg.linearRampToValueAtTime(.62,t+.6)}
  playSide(side);startSched();
}

/* 切换：交叉淡入淡出 + 起停调度 */
function playSide(side){
  ensureCtx();
  if(AC.state==="suspended")AC.resume();
  if(curSide===side)return;
  userStopped=false;
  var other=side==="L"?"R":"L";
  var t=AC.currentTime;
  if(curSide){ /* 旧侧优雅淡出，尾音自然消散 */
    var og=buses[other].mg.gain;
    og.cancelScheduledValues(t);og.setValueAtTime(og.value,t);
    og.linearRampToValueAtTime(0,t+.9);
  }
  var ng=buses[side].mg.gain;
  ng.cancelScheduledValues(t);ng.setValueAtTime(ng.value,t);
  ng.linearRampToValueAtTime(1,t+.9);
  if(sched[side].next<AC.currentTime-.1)sched[side].next=AC.currentTime+.1; /* 停久后续播防追帧 */
  lastSide=side;curSide=side;ui();
}
function ui(){
  document.getElementById("sideL").classList.toggle("on",curSide==="L");
  document.getElementById("sideR").classList.toggle("on",curSide==="R");
  document.getElementById("modeL").textContent=curSide==="L"?"左声道 · 正在播放":"左声道 · 点击播放";
  document.getElementById("modeR").textContent=curSide==="R"?"右声道 · 正在播放":"右声道 · 点击播放";
  var b=document.getElementById("btnStop");
  b.style.display="flex";
  if(curSide){b.classList.remove("go","off");document.getElementById("stopTxt").textContent="关闭声音"}
  else{b.classList.add("go","off");document.getElementById("stopTxt").textContent="继续播放 · "+(SONGS[lastSide].name+" "+SONGS[lastSide].key)}
}

/* 音符雨显示 */
function showNote(side,midi){
  var box=document.getElementById("notes"+side);
  var sp=document.createElement("span");
  sp.textContent=NOTE[midi%12]+(Math.floor(midi/12)-1);
  box.appendChild(sp);
  while(box.children.length>6)box.removeChild(box.firstChild);
  setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp)},3300);
}

/* 启动：尽量自动播左声道；被浏览器拦则给大播放键 */
var booted=false;
function boot(){
  if(booted)return;booted=true;
  ensureCtx();
  AC.resume().then(function(){
    if(AC.state==="running"){
      document.getElementById("gate").classList.add("off");
      playSide("L");
      if(!schedTimer)schedTimer=setInterval(tick,110);
    }
  }).catch(function(){
    document.getElementById("gate").style.display="flex";
  });
}
function tryResume(){
  if(!AC)return;
  if(AC.state!=="running"){
    AC.resume().then(function(){
      if(AC.state==="running"){
        document.getElementById("gate").classList.add("off");
        if(!curSide&&!userStopped)playSide("L");
        startSched();
      }
    }).catch(function(){});
  }
}
window.addEventListener("load",boot);
/* 首个手势兜底（有些浏览器手势才算数）——用户关掉后不复活 */
["touchstart","mousedown","keydown"].forEach(function(ev){
  window.addEventListener(ev,function(){if(booted)tryResume()},{passive:true});
});
document.getElementById("gateBtn").addEventListener("click",function(){
  tryResume();
  if(AC&&AC.state==="running"){document.getElementById("gate").classList.add("off");if(!curSide)playSide("L");startSched()}
});
/* 关闭/继续 */
document.getElementById("btnStop").addEventListener("click",function(){
  if(curSide)stopAudio();else resumeAudio(lastSide||"L");
});
/* 卡片切换（关闭态点卡=直接播该侧） */
document.getElementById("sideL").addEventListener("click",function(){if(curSide==="L")return;tryResume();if(userStopped||!curSide)resumeAudio("L");else{playSide("L");startSched()}});
document.getElementById("sideR").addEventListener("click",function(){if(curSide==="R")return;tryResume();if(userStopped||!curSide)resumeAudio("R");else{playSide("R");startSched()}});
/* 从后台切回前台时续播；切走时立即安静（不留背景音乐） */
document.addEventListener("visibilitychange",function(){
  if(document.hidden){hiddenQuiet()}
  else{comeBack()}
});
var hiddenT=null;
function hiddenQuiet(){
  if(!AC)return;
  var t=AC.currentTime;
  var mg=master.gain;
  mg.cancelScheduledValues(t);mg.setValueAtTime(mg.value,t);
  mg.linearRampToValueAtTime(0,t+.35);
  if(schedTimer){clearInterval(schedTimer);schedTimer=null}
  if(hiddenT)clearTimeout(hiddenT);
  hiddenT=setTimeout(function(){hiddenT=null;if(document.hidden&&AC)AC.suspend()},900);
}
function comeBack(){
  if(hiddenT){clearTimeout(hiddenT);hiddenT=null}
  if(!AC||!curSide)return; /* 用户自己关了就保持安静 */
  var go=function(){
    var t=AC.currentTime;
    var mg=master.gain;
    if(mg.value<0.1){mg.cancelScheduledValues(t);mg.setValueAtTime(mg.value,t);mg.linearRampToValueAtTime(.62,t+.5)}
    if(curSide&&sched[curSide].next<AC.currentTime-.1)sched[curSide].next=AC.currentTime+.1;
    startSched();
  };
  if(AC.state!=="running"){AC.resume().then(function(){if(AC.state==="running"&&curSide)go()}).catch(function(){})}
  else go();
}
window.addEventListener("pagehide",function(){if(AC&&AC.state==="running")AC.suspend()});
</script>
</body>
</html>
