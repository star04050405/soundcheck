<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOUND CHECK. 左右声道测试</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<meta name="theme-color" content="#F5F5F7">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;background:#F5F5F7;color:#1C1C1E;letter-spacing:-.01em;min-height:100vh;padding:0 20px calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
header{padding:54px 6px 8px}
h1{font-size:44px;font-weight:700;letter-spacing:-.03em}
h1 .dot{color:#007AFF}
.sub{font-size:15px;color:#86868B;margin-top:4px;letter-spacing:0}
/* L/R 大卡 */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
.card{background:#FFFFFF;border-radius:24px;padding:22px 18px 20px;text-align:center;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1.5px solid rgba(0,0,0,.04);transition:all .3s}
.card.live{border-color:#007AFF;box-shadow:0 4px 22px rgba(0,122,255,.28)}
.big{font-size:58px;font-weight:800;letter-spacing:-.04em;color:#D1D1D6;line-height:1;transition:color .25s}
.card.live .big{color:#007AFF}
.lbl{font-size:11px;color:#86868B;margin-top:6px;letter-spacing:.14em;text-transform:uppercase}
/* 波纹 */
.rings{position:absolute;left:0;right:0;top:0;height:100%;pointer-events:none;opacity:0;transition:opacity .3s}
.card.live .rings{opacity:1}
.rings i{position:absolute;left:50%;top:44px;width:20px;height:20px;border-radius:50%;border:2px solid rgba(0,122,255,.5);transform:translate(-50%,-50%)}
.rings i:nth-child(1){animation:ring 1.6s ease-out infinite}
.rings i:nth-child(2){animation:ring 1.6s ease-out .53s infinite}
.rings i:nth-child(3){animation:ring 1.6s ease-out 1.06s infinite}
@keyframes ring{0%{width:20px;height:20px;opacity:.9}100%{width:150px;height:150px;opacity:0}}
/* 电平表 */
.vu{height:6px;background:#E9E9EB;border-radius:3px;margin-top:16px;overflow:hidden}
.vu i{display:block;height:100%;width:0;background:linear-gradient(90deg,#007AFF,#5AC8FA);border-radius:3px;transition:width .08s linear}
.okbtn{margin-top:12px;font-size:12.5px;color:#86868B;background:none;border:1.5px solid #E5E5EA;border-radius:13px;padding:5px 13px;cursor:pointer;letter-spacing:0}
.okbtn.on{color:#fff;background:#34C759;border-color:#34C759}
.okbtn.on:after{content:" ✓ 听到了"}
/* 主按钮组 */
.group{background:#FFFFFF;border-radius:22px;padding:14px;margin-top:22px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.gtitle{font-size:12px;color:#86868B;letter-spacing:.1em;text-transform:uppercase;padding:2px 12px 10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row.one{grid-template-columns:1fr 1fr 1fr}
.btn{border:0;background:#F2F2F7;border-radius:14px;padding:14px 8px;font-size:14.5px;font-weight:600;font-family:inherit;color:#1C1C1E;cursor:pointer;letter-spacing:-.01em;transition:all .2s}
.btn em{font-style:normal;display:block;font-size:10.5px;color:#86868B;font-weight:500;margin-top:2px;letter-spacing:.08em}
.btn.act{background:#007AFF;color:#fff}
.btn.act em{color:rgba(255,255,255,.75)}
.btn.stop{background:#FF3B30;color:#fff;width:100%;grid-column:1/-1;padding:14px}
.btn.sweep{grid-column:1/-1;background:#1C1C1E;color:#fff;padding:14px}
.btn.sweep.act{background:#5E5CE6}
/* 声音类型 */
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 2px}
.chip{border:1.5px solid #E5E5EA;background:#fff;color:#3A3A3C;border-radius:16px;padding:8px 16px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .2s}
.chip.on{background:#007AFF;border-color:#007AFF;color:#fff}
.chip small{color:#86868B;font-size:11px;margin-left:4px}
.chip.on small{color:rgba(255,255,255,.8)}
.freqs{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.freqs.hide{display:none}
.note{font-size:12.5px;color:#86868B;line-height:1.7;margin-top:18px;padding:0 6px;letter-spacing:0}
.note b{color:#3A3A3C;font-weight:600}
footer{margin-top:30px;text-align:center;font-size:11.5px;color:#AEAEB2;line-height:1.8;letter-spacing:.02em}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>SOUND CHECK<span class="dot">.</span></h1>
  <div class="sub">左右声道测试 · stereo channel test</div>
</header>

<div class="meters">
  <div class="card" id="cardL">
    <div class="rings"><i></i><i></i><i></i></div>
    <div class="big">L</div>
    <div class="lbl">左声道 · Left</div>
    <div class="vu"><i id="vuL"></i></div>
    <button class="okbtn" id="okL" ontouchstart="">听到了</button>
  </div>
  <div class="card" id="cardR">
    <div class="rings"><i></i><i></i><i></i></div>
    <div class="big">R</div>
    <div class="lbl">右声道 · Right</div>
    <div class="vu"><i id="vuR"></i></div>
    <button class="okbtn" id="okR" ontouchstart="">听到了</button>
  </div>
</div>

<div class="group">
  <div class="gtitle">播放 · Play</div>
  <div class="row one">
    <button class="btn" id="bL" ontouchstart="">🔊 只测左<em>LEFT ONLY</em></button>
    <button class="btn" id="bR" ontouchstart="">🔊 只测右<em>RIGHT ONLY</em></button>
    <button class="btn" id="bB" ontouchstart="">🔊 双声道<em>BOTH</em></button>
  </div>
  <div class="row" style="margin-top:10px">
    <button class="btn sweep" id="bS" ontouchstart="">🛳 声像巡航 · L → R 缓慢扫过（9 秒）</button>
    <button class="btn stop" id="bStop" ontouchstart="">停止 ⏹</button>
  </div>
</div>

<div class="group">
  <div class="gtitle">声音 · Signal</div>
  <div class="chips">
    <button class="chip on" data-t="sine" ontouchstart="">正弦波<small>sine</small></button>
    <button class="chip" data-t="white" ontouchstart="">白噪声<small>white</small></button>
    <button class="chip" data-t="pink" ontouchstart="">粉红噪声<small>pink</small></button>
  </div>
  <div class="freqs" id="freqs">
    <button class="chip" data-f="200" ontouchstart="">200 Hz</button>
    <button class="chip on" data-f="440" ontouchstart="">440 Hz</button>
    <button class="chip" data-f="1000" ontouchstart="">1 kHz</button>
    <button class="chip" data-f="4000" ontouchstart="">4 kHz</button>
    <button class="chip" data-f="10000" ontouchstart="">10 kHz</button>
  </div>
</div>

<div class="note">
  <b>怎么测</b>：戴上耳机，分别点「只测左 / 只测右」——声音应该只出现在对应一侧耳朵。如果两边都响=声道混了，如果没声=该声道故障。双声道确认中间结像，「声像巡航」听声音从左耳慢慢滑到右耳再回来。<br>
  正弦波测纯净度，白噪声测全频段，粉红噪声最接近真实音乐的能量分布。换类型和频率会立即以当前模式重播，方便对比。
</div>

<footer>🎧 建议佩戴耳机测试 · 音量适中，长时间大音量可能损伤听力</footer>
</div>

<script>
var AC=null,master,merger,gainL,gainR,anaL,anaR,cur=null,playMode=null,sweepTimer=null;
var curType="sine",curFreq=440;
var noiseB={};
var OKKEY="sc_lr_v1";
var okd={};
try{okd=JSON.parse(localStorage.getItem(OKKEY))||{}}catch(e){okd={}}

function ensureCtx(){
  if(AC)return;
  var C=window.AudioContext||window.webkitAudioContext;
  AC=new C();
  merger=AC.createChannelMerger(2);
  master=AC.createGain();master.gain.value=.75;
  gainL=AC.createGain();gainR=AC.createGain();
  anaL=AC.createAnalyser();anaR=AC.createAnalyser();
  anaL.fftSize=1024;anaR.fftSize=1024;
  gainL.connect(anaL);anaL.connect(merger,0,0);
  gainR.connect(anaR);anaR.connect(merger,0,1);
  merger.connect(master);master.connect(AC.destination);
  gainL.gain.value=0;gainR.gain.value=0;
}
function whiteBuffer(){
  var len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*.5;
  return buf;
}
function pinkBuffer(){
  var len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(var i=0;i<len;i++){
    var w=Math.random()*2-1;
    b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.96900*b2+w*.1538520;
    b3=.86650*b3+w*.3104856;b4=.55000*b4+w*.5329522;b5=-.7616*b5-w*.0168980;
    var p=b0+b1+b2+b3+b4+b5+b6+w*.5362;b6=w*.115926;
    d[i]=p*.11;
  }
  return buf;
}
function makeSource(){
  if(curType==="sine"){
    var o=AC.createOscillator();o.type="sine";o.frequency.value=curFreq;return o;
  }
  var s=AC.createBufferSource();
  s.buffer=noiseB[curType]||(noiseB[curType]=curType==="white"?whiteBuffer():pinkBuffer());
  s.loop=true;return s;
}
function stopAll(){
  if(sweepTimer){clearTimeout(sweepTimer);sweepTimer=null}
  if(cur){try{cur.stop()}catch(e){}try{cur.disconnect()}catch(e){}cur=null}
  if(AC){gainL.gain.cancelScheduledValues(AC.currentTime);gainR.gain.cancelScheduledValues(AC.currentTime);gainL.gain.value=0;gainR.gain.value=0}
  playMode=null;ui();
}
function play(mode){
  stopAll();ensureCtx();
  if(AC.state==="suspended")AC.resume();
  cur=makeSource();
  cur.connect(gainL);cur.connect(gainR);
  gainL.gain.value=(mode==="L"||mode==="B")?1:0;
  gainR.gain.value=(mode==="R"||mode==="B")?1:0;
  cur.start();
  playMode=mode;ui();
}
function sweep(){
  stopAll();ensureCtx();
  if(AC.state==="suspended")AC.resume();
  cur=makeSource();
  cur.connect(gainL);cur.connect(gainR);
  var t=AC.currentTime,D=9;
  gainL.gain.setValueAtTime(1,t);gainR.gain.setValueAtTime(0,t);
  gainL.gain.linearRampToValueAtTime(0,t+D/2);gainR.gain.linearRampToValueAtTime(1,t+D/2);
  gainL.gain.linearRampToValueAtTime(1,t+D);gainR.gain.linearRampToValueAtTime(0,t+D);
  cur.start();try{cur.stop(t+D)}catch(e){}
  playMode="S";ui();
  sweepTimer=setTimeout(function(){if(playMode==="S")stopAll()},D*1000+150);
}
/* UI */
function ui(){
  document.getElementById("bL").classList.toggle("act",playMode==="L");
  document.getElementById("bR").classList.toggle("act",playMode==="R");
  document.getElementById("bB").classList.toggle("act",playMode==="B");
  document.getElementById("bS").classList.toggle("act",playMode==="S");
  document.getElementById("bStop").style.display=playMode?"block":"none";
}
/* 电平表 */
var tdL=new Uint8Array(1024),tdR=new Uint8Array(1024);
function rms(a){var s=0;for(var i=0;i<a.length;i++){var v=(a[i]-128)/128;s+=v*v}return Math.sqrt(s/a.length)}
var lastL=0,lastR=0;
function frame(){
  if(AC){
    anaL.getByteTimeDomainData(tdL);anaR.getByteTimeDomainData(tdR);
    var rl=rms(tdL),rr=rms(tdR);
    lastL=Math.max(rl,lastL*.86);lastR=Math.max(rr,lastR*.86);
    document.getElementById("vuL").style.width=Math.min(100,lastL*260)+"%";
    document.getElementById("vuR").style.width=Math.min(100,lastR*260)+"%";
    document.getElementById("cardL").classList.toggle("live",rl>.01);
    document.getElementById("cardR").classList.toggle("live",rr>.01);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* 绑定 */
document.getElementById("bL").addEventListener("click",function(){play("L")});
document.getElementById("bR").addEventListener("click",function(){play("R")});
document.getElementById("bB").addEventListener("click",function(){play("B")});
document.getElementById("bS").addEventListener("click",function(){playMode==="S"?stopAll():sweep()});
document.getElementById("bStop").addEventListener("click",stopAll);
document.querySelectorAll(".chips .chip").forEach(function(c){
  c.addEventListener("click",function(){
    document.querySelectorAll(".chips .chip").forEach(function(x){x.classList.remove("on")});
    c.classList.add("on");curType=c.dataset.t;
    document.getElementById("freqs").classList.toggle("hide",curType!=="sine");
    if(playMode&&playMode!=="S")play(playMode);
  });
});
document.querySelectorAll("#freqs .chip").forEach(function(c){
  c.addEventListener("click",function(){
    document.querySelectorAll("#freqs .chip").forEach(function(x){x.classList.remove("on")});
    c.classList.add("on");curFreq=parseFloat(c.dataset.f);
    if(playMode&&playMode!=="S")play(playMode);
  });
});
function okUi(){
  document.getElementById("okL").classList.toggle("on",!!okd.L);
  document.getElementById("okR").classList.toggle("on",!!okd.R);
}
["L","R"].forEach(function(s){
  document.getElementById("ok"+s).addEventListener("click",function(){
    if(okd[s])delete okd[s];else okd[s]=1;
    try{localStorage.setItem(OKKEY,JSON.stringify(okd))}catch(e){}
    okUi();
  });
});
okUi();
</script>
</body>
</html>
